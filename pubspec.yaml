name: kidoraplay
description: "Kidoraplay: a playful preschool learning app with Kido the elephant."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  intl: any
  just_audio: ^0.10.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/images/sections/
    - assets/images/numbers/
    - assets/images/abc/
    - assets/images/animals/
    - assets/images/birds/
    - assets/images/games/
    - assets/images/hindi/
    - assets/images/vehicles/
    - assets/images/shapes/
    - assets/images/colours/
    - assets/images/vegetables/
    - assets/images/fruits/
    - assets/images/body/
    - assets/images/family/
    - assets/images/days/
    - assets/images/months/
    - assets/images/opposites/
    - assets/audio/en/
    - assets/audio/en/kido/
    - assets/audio/en/sections/
    - assets/audio/hi/
    - assets/audio/hi/kido/
    - assets/audio/hi/sections/
    - assets/audio/letters/
    - assets/audio/hi/letters/
    - assets/audio/animals/
    - assets/audio/birds/
    - assets/audio/vehicles/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/music/notes/
    - assets/audio/ATTRIBUTION.md
    - assets/images/NOTICE-noto-emoji.txt
    - assets/images/PHOTO_CREDITS.md
    - assets/fonts/OFL.txt

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
