name: kidoraplay
description: "Kidoraplay: a playful preschool learning app with Kido the elephant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/images/sections/
    - assets/images/numbers/
    - assets/images/abc/
    - assets/images/animals/
    - assets/images/birds/
    - assets/audio/en/
    - assets/audio/en/kido/
    - assets/audio/en/sections/
    - assets/audio/hi/
    - assets/audio/hi/kido/
    - assets/audio/hi/sections/
    - assets/audio/letters/
    - assets/audio/animals/
    - assets/audio/birds/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
